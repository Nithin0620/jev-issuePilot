name: IssuePilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit & integration tests
        run: npm test

      - name: Lint codebase
        run: npm run lint

      - name: Verify production build
        run: npm run build
        env:
          TYPESAFE_API_KEY: ci-placeholder
          MOCK_JEV: true
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: ci-secret-key-placeholder-32-chars-long
          NEXTAUTH_URL: http://localhost:3000
