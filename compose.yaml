services:
  db:
    image: postgres:16-alpine
    container_name: issuepilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: issuepilot
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: issuepilot
    ports:
      - "5432:5432"
    volumes:
      - issuepilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuepilot -d issuepilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: issuepilot_app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://issuepilot:localpassword@db:5432/issuepilot
    depends_on:
      db:
        condition: service_healthy

volumes:
  issuepilot_pgdata:
